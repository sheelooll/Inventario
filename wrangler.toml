# Configuración de Cloudflare Worker con assets estáticos.
# "name" DEBE coincidir con el nombre de tu Worker en el dashboard de Cloudflare.
# El sitio es 100% estático: sin "main", el Worker solo sirve la carpeta de assets.
name = "inventario"
compatibility_date = "2024-11-01"

[assets]
directory = "./inventario/public"
not_found_handling = "404-page"
